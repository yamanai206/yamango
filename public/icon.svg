<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#d97706" stroke-width="6" opacity="0.4" />

  <!-- Shield Shape representing Escrow in Suwayda & Kafr -->
  <path d="M256 64 L396 112 C396 256 340 376 256 428 C172 376 116 256 116 112 Z" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Stylized Vehicle & Tractor Silhouette in center -->
  <g transform="translate(146, 170) scale(0.9)">
    <!-- Cabin -->
    <path d="M70 120 L110 50 L190 50 L210 120 Z" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Hood / Front -->
    <path d="M70 120 L20 120 L10 150 L230 150 L230 120 Z" fill="url(#goldGrad)" />
    <!-- Rear Big Tractor Wheel -->
    <circle cx="190" cy="165" r="46" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="12" />
    <circle cx="190" cy="165" r="20" fill="url(#goldGrad)" />
    <!-- Front Wheel -->
    <circle cx="50" cy="175" r="32" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="10" />
    <circle cx="50" cy="175" r="14" fill="url(#goldGrad)" />
  </g>

  <!-- Notification Sparkle / Bell Badge -->
  <circle cx="396" cy="116" r="38" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="6" />
  <path d="M396 98 L404 114 L422 116 L408 128 L412 146 L396 136 L380 146 L384 128 L370 116 L388 114 Z" fill="#ffffff" />

  <!-- Platform Name Text -->
  <text x="256" y="475" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" fill="#fbbf24" letter-spacing="4">yamango</text>
</svg>
